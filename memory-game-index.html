<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Card Quest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;background:#070b20;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 20%,#7c3aed 0 8%,transparent 28%),radial-gradient(circle at 85% 15%,#06b6d4 0 7%,transparent 25%),radial-gradient(circle at 70% 85%,#ec4899 0 5%,transparent 25%),linear-gradient(135deg,#070b20,#11133d 50%,#090b1f);filter:blur(15px)}
body:after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.app{width:min(1120px,94%);margin:auto;padding:28px 0 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.logo{font-family:"Space Grotesk";font-size:28px;font-weight:800;letter-spacing:-1px}.logo span{color:#67e8f9}.sub{color:#a9b1d6;font-size:12px;margin-top:3px}
button,select{font:inherit}.btn{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:white;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;backdrop-filter:blur(12px);transition:.2s}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:rgba(12,17,45,.7);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:13px 15px;box-shadow:0 12px 35px #0003;backdrop-filter:blur(16px)}.stat small{display:block;color:#929bc4;font-size:11px;text-transform:uppercase;letter-spacing:1px}.stat b{display:block;font-size:23px;margin-top:3px}.accent{color:#67e8f9}.pink{color:#f9a8d4}.yellow{color:#fde68a}.green{color:#86efac}
.progress-wrap{margin:0 0 18px;background:rgba(255,255,255,.08);height:7px;border-radius:99px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#67e8f9,#8b5cf6,#f472b6);transition:width .35s}
.game-shell{background:rgba(8,12,35,.65);border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:22px;box-shadow:0 25px 80px #0006;backdrop-filter:blur(20px)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.level{font-weight:800;font-family:"Space Grotesk";font-size:18px}.hint{color:#aab2d4;font-size:13px}.controls{display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:820px;margin:auto}
.card{aspect-ratio:1/1;perspective:900px;cursor:pointer;position:relative}.inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;border:1px solid rgba(255,255,255,.13);overflow:hidden}
.back{background:linear-gradient(145deg,rgba(31,41,93,.95),rgba(12,16,52,.95));box-shadow:inset 0 0 30px #67e8f922}.back:after{content:"✦";font-size:35px;color:#67e8f9;text-shadow:0 0 25px #22d3ee}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#1c275d,#10153b);font-size:clamp(35px,6vw,58px);box-shadow:0 0 35px #8b5cf633}.card:hover:not(.flipped):not(.matched) .inner{transform:translateY(-4px)}.matched .front{box-shadow:0 0 35px #34d39966;border-color:#34d39966}.matched{cursor:default}
.overlay{position:fixed;inset:0;background:#030615b8;display:none;place-items:center;padding:20px;z-index:5;backdrop-filter:blur(9px)}.modal{width:min(440px,100%);text-align:center;background:linear-gradient(145deg,#171d4d,#0c102e);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:32px;box-shadow:0 30px 100px #0008}.modal h1{font-family:"Space Grotesk";font-size:36px;margin:0 0 8px}.modal p{color:#aeb6d8}.bigscore{font-size:52px;font-weight:800;color:#67e8f9;margin:12px}.modal .btn{margin-top:12px;background:linear-gradient(90deg,#7c3aed,#ec4899);border:0;width:100%;padding:14px}
.toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-20px);opacity:0;padding:11px 17px;border-radius:99px;background:#11183c;border:1px solid #ffffff22;box-shadow:0 10px 35px #0006;transition:.25s;z-index:10;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{display:none}.grid{grid-template-columns:repeat(4,1fr);gap:9px}.game-shell{padding:13px;border-radius:22px}.face{border-radius:14px}.toolbar{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls .btn{flex:1}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}

/* === Motion + Dashboard Upgrade === */
@keyframes floatCard{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(.6deg)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 rgba(103,232,249,0)}50%{box-shadow:0 0 32px rgba(103,232,249,.18)}}
@keyframes popIn{0%{opacity:0;transform:scale(.82) translateY(15px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes matchBurst{0%{transform:scale(1)}45%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
@keyframes particle{0%{transform:translateY(0) scale(1);opacity:.8}100%{transform:translateY(-110px) scale(0);opacity:0}}
.card{animation:popIn .45s both}
.card:nth-child(2n){animation-delay:.035s}.card:nth-child(3n){animation-delay:.07s}.card:nth-child(4n){animation-delay:.105s}
.card:not(.flipped):not(.matched) .back{animation:floatCard 4s ease-in-out infinite}
.card.matched .front{animation:matchBurst .45s ease-out,glowPulse 1.4s ease-in-out infinite}
.game-shell{position:relative;overflow:hidden}
.game-shell:before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.045) 45%,transparent 55%);background-size:500px 100%;animation:shimmer 8s linear infinite;pointer-events:none}
.dashboard{margin-top:18px;background:rgba(8,12,35,.72);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px;box-shadow:0 18px 55px #0004}
.dash-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dash-head h2{margin:0;font-family:"Space Grotesk";font-size:21px}.dash-head span{color:#929bc4;font-size:12px}
.history{display:grid;gap:9px;max-height:290px;overflow:auto;padding-right:4px}
.history-row{display:grid;grid-template-columns:1.2fr .7fr .7fr .8fr .7fr;gap:8px;align-items:center;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);font-size:12px}
.history-row b{font-size:13px}.win{color:#86efac}.loss{color:#fda4af}.muted{color:#8d96bd}
.empty{text-align:center;color:#8790b8;padding:28px 10px}
.clear-btn{padding:8px 12px;font-size:11px}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;background:#67e8f9;animation:particle 1.2s ease-out forwards}
@media(max-width:700px){.history-row{grid-template-columns:1fr 1fr 1fr}.history-row span:nth-child(4),.history-row span:nth-child(5){display:none}}


/* === Full Menu & Analytics Dashboard === */
.menu-btn{font-size:20px;padding:9px 13px}
.menu-panel{position:fixed;inset:0;z-index:20;display:none;background:rgba(2,5,20,.72);backdrop-filter:blur(12px)}
.menu-panel.open{display:block}
.menu-card{position:absolute;right:18px;top:18px;width:min(680px,calc(100% - 36px));max-height:calc(100vh - 36px);overflow:auto;background:linear-gradient(145deg,#151b4b,#090d2a);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:22px;box-shadow:0 30px 100px #0009;animation:popIn .25s ease-out}
.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.menu-head h2{margin:0;font-family:"Space Grotesk";font-size:24px}.close-btn{font-size:20px;width:42px;height:42px;padding:0}
.tabs{display:flex;gap:7px;margin-bottom:16px;overflow:auto}.tab{white-space:nowrap;padding:9px 13px;border-radius:12px;border:1px solid #ffffff12;background:#ffffff08;color:#aeb6d8;cursor:pointer;font-weight:700}.tab.active{color:#fff;background:linear-gradient(90deg,#7c3aed,#2563eb);border-color:transparent}
.panel{display:none}.panel.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.kpi{padding:14px;border-radius:15px;background:#ffffff07;border:1px solid #ffffff0d}.kpi small{display:block;color:#8992b9;font-size:10px;text-transform:uppercase}.kpi b{font-size:21px;display:block;margin-top:4px}
.day-title{font-weight:800;margin:16px 0 8px;color:#cbd5ff}.day-card{background:#ffffff06;border:1px solid #ffffff0a;border-radius:16px;margin-bottom:9px;padding:12px}.day-top{display:flex;justify-content:space-between;gap:10px}.day-top b{font-size:14px}.day-meta{display:flex;gap:14px;color:#8e97bd;font-size:11px;margin-top:6px;flex-wrap:wrap}
.achievement{display:flex;gap:12px;align-items:center;padding:13px;border-radius:15px;background:#ffffff06;border:1px solid #ffffff0b;margin-bottom:9px}.achievement .icon{font-size:27px}.achievement.locked{opacity:.42;filter:grayscale(1)}.achievement b{display:block}.achievement small{color:#929bc4}
.chart{height:150px;display:flex;align-items:flex-end;gap:7px;padding:12px;background:#ffffff05;border-radius:15px;margin-top:12px}.bar{flex:1;min-width:5px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#67e8f9,#7c3aed);position:relative}.bar span{position:absolute;bottom:calc(100% + 3px);font-size:8px;color:#9da6c9;width:100%;text-align:center}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.menu-card{right:10px;top:10px;width:calc(100% - 20px);max-height:calc(100vh - 20px)}}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="logo">MEMORY<span>⚡MATCH</span></div><div class="sub">Train your brain. Beat your best.</div></div>
    <div style="display:flex;gap:8px"><button class="btn menu-btn" id="menuBtn">☰</button><button class="btn" id="restart">↻ New Game</button></div>
  </header>

  <section class="stats">
    <div class="stat"><small>Level</small><b class="accent" id="level">1</b></div>
    <div class="stat"><small>Score</small><b class="yellow" id="score">0</b></div>
    <div class="stat"><small>Combo</small><b class="pink" id="combo">x0</b></div>
    <div class="stat"><small>Time</small><b id="time">60s</b></div>
    <div class="stat"><small>Best</small><b class="green" id="best">0</b></div>
  </section>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>

  <main class="game-shell">
    <div class="toolbar">
      <div><div class="level" id="title">Level 1 · Starter</div><div class="hint">Find every matching pair before time runs out.</div></div>
      <div class="controls"><button class="btn" id="pause">Ⅱ Pause</button><button class="btn" id="sound">🔊 Sound</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

<section class="dashboard">
  <div class="dash-head">
    <div><h2>📊 Game Dashboard</h2><span>Your saved performance history</span></div>
    <button class="btn clear-btn" id="clearHistory">Clear History</button>
  </div>
  <div class="history" id="history"></div>
</section>

</div>

<div class="particles" id="particles"></div>

<div class="menu-panel" id="menuPanel">
 <div class="menu-card">
  <div class="menu-head"><h2>☰ Game Center</h2><button class="btn close-btn" id="closeMenu">×</button></div>
  <div class="tabs">
   <button class="tab active" data-tab="daily">📅 Daily</button>
   <button class="tab" data-tab="all">📊 All History</button>
   <button class="tab" data-tab="stats">🏆 Stats</button>
   <button class="tab" data-tab="achievements">🎖️ Achievements</button>
  </div>
  <div class="panel active" id="dailyPanel"></div>
  <div class="panel" id="allPanel"></div>
  <div class="panel" id="statsPanel"></div>
  <div class="panel" id="achievementsPanel"></div>
 </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal">
  <div id="modalEmoji" style="font-size:54px">🏆</div><h1 id="modalTitle">Level Complete!</h1>
  <p id="modalText">Amazing memory.</p><div class="bigscore" id="modalScore">0</div>
  <button class="btn" id="modalBtn">Next Level →</button>
</div></div>

<script>
const icons=["🍒","🍋","🍉","🍇","🍓","🥝","🍍","🥥","🍑","🍊","🥑","🌽","🍀","⭐","🔥","💎","🚀","🎯","🎵","⚡","🌈","🦊","🐼","🐸","🦄","👑"];
const $=id=>document.getElementById(id);
let level=1,score=0,combo=0,time=60,timer=null,paused=false,lock=false,first=null,matched=0,soundOn=true,best=+localStorage.getItem("memoryBest")||0;
$("best").textContent=best;

function settings(){return {pairs:Math.min(4+level,12),time:Math.max(25,65-level*5)}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(freq=500,dur=.07){if(!soundOn)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.035;o.start();o.stop(c.currentTime+dur)}catch(e){}}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1100)}
function update(){ $("level").textContent=level;$("score").textContent=score;$("combo").textContent="x"+combo;$("time").textContent=time+"s";$("best").textContent=best;$("progress").style.width=(matched/settings().pairs*100)+"%";$("title").textContent=`Level ${level} · ${level===1?"Starter":level<4?"Focus":level<7?"Speed":"Master"}`}

const HISTORY_KEY="memoryMatchHistoryV2";
let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");


function dayKey(dateString){return dateString.split(",")[0]}
function analytics(){
 const wins=history.filter(x=>x.result==="WIN"), total=history.length;
 const totalScore=history.reduce((a,x)=>a+x.score,0), bestGame=history.reduce((a,x)=>Math.max(a,x.score),0);
 const avg=total?Math.round(totalScore/total):0;
 const today=new Date().toLocaleDateString([], {day:"2-digit",month:"short"});
 const todayGames=history.filter(x=>dayKey(x.date)===today);
 const todayScore=todayGames.reduce((a,x)=>a+x.score,0);
 const bestLevel=history.reduce((a,x)=>Math.max(a,x.level),0);
 return {wins,total,totalScore,bestGame,avg,today,todayGames,todayScore,bestLevel};
}
function renderMenu(){
 const a=analytics();
 $("dailyPanel").innerHTML=`
 <div class="kpis"><div class="kpi"><small>Today's Games</small><b>${a.todayGames.length}</b></div><div class="kpi"><small>Today's Score</small><b>${a.todayScore.toLocaleString()}</b></div><div class="kpi"><small>Today's Wins</small><b>${a.todayGames.filter(x=>x.result==="WIN").length}</b></div></div>
 <div class="day-title">Today · ${a.today}</div>
 ${a.todayGames.length?a.todayGames.map(h=>row(h)).join(""):'<div class="empty">No games played today yet.</div>'}
 <div class="day-title">Recent Days</div>
 ${recentDays()}
 `;
 $("allPanel").innerHTML=history.length?history.map(row).join(""):'<div class="empty">No saved games yet.</div>';
 $("statsPanel").innerHTML=`
 <div class="kpis">
  <div class="kpi"><small>Total Games</small><b>${a.total}</b></div><div class="kpi"><small>Total Wins</small><b>${a.wins}</b></div><div class="kpi"><small>Win Rate</small><b>${a.total?Math.round(a.wins/a.total*100):0}%</b></div>
  <div class="kpi"><small>Total Score</small><b>${a.totalScore.toLocaleString()}</b></div><div class="kpi"><small>Average Score</small><b>${a.avg.toLocaleString()}</b></div><div class="kpi"><small>Best Game</small><b>${a.bestGame.toLocaleString()}</b></div>
 </div><div class="day-title">Last 10 Games Score</div>${scoreChart()}
 `;
 const ach=[
  ["🌱","First Match","Complete your first game",a.total>=1],
  ["🔥","Hot Streak","Win 3 games",a.wins>=3],
  ["🏆","Champion","Win 10 games",a.wins>=10],
  ["💎","Score Hunter","Reach 5,000 total score",a.totalScore>=5000],
  ["🚀","Level Master","Reach Level 5",a.bestLevel>=5],
  ["⚡","High Roller","Score 1,000+ in one game",a.bestGame>=1000]
 ];
 $("achievementsPanel").innerHTML=ach.map(x=>`<div class="achievement ${x[3]?"":"locked"}"><div class="icon">${x[0]}</div><div><b>${x[1]} ${x[3]?"✓":"🔒"}</b><small>${x[2]}</small></div></div>`).join("");
}
function row(h){return `<div class="day-card"><div class="day-top"><b>${h.result==="WIN"?"🏆":"⏰"} Level ${h.level} · ${h.score.toLocaleString()} pts</b><span class="${h.result==="WIN"?"win":"loss"}">${h.result}</span></div><div class="day-meta"><span>${h.date}</span><span>${h.pairs} pairs</span><span>${h.timeLeft}s left</span><span>Combo x${h.combo}</span></div></div>`}
function recentDays(){
 const days={}; history.forEach(h=>{(days[dayKey(h.date)]??=[]).push(h)});
 return Object.entries(days).slice(0,7).map(([d,arr])=>`<div class="day-title">${d} · ${arr.length} game${arr.length>1?"s":""} · ${arr.reduce((s,x)=>s+x.score,0).toLocaleString()} pts</div>`).join("");
}
function scoreChart(){
 const arr=history.slice(0,10).reverse(), max=Math.max(...arr.map(x=>x.score),1);
 return `<div class="chart">${arr.map(x=>`<div class="bar" style="height:${Math.max(8,x.score/max*100)}%"><span>${x.score}</span></div>`).join("")}</div>`;
}
function openMenu(){renderMenu();$("menuPanel").classList.add("open")}
function closeMenu(){$("menuPanel").classList.remove("open")}

function saveHistory(won){
  const s=settings();
  const record={
    date:new Date().toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),
    level, score, result:won?"WIN":"TIME OUT",
    pairs:s.pairs, timeLeft:time, combo
  };
  history.unshift(record); history=history.slice(0,50);
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
  renderHistory();
  if($("menuPanel").classList.contains("open")) renderMenu();
}
function renderHistory(){
  const box=$("history");
  if(!history.length){box.innerHTML='<div class="empty">No games yet. Complete your first round to build your history.</div>';return}
  box.innerHTML=history.map((h,i)=>`
    <div class="history-row">
      <span class="muted">${h.date}</span>
      <span>Lv ${h.level}</span>
      <b>${h.score.toLocaleString()} pts</b>
      <span>${h.pairs} pairs</span>
      <span class="${h.result==="WIN"?"win":"loss"}">${h.result}</span>
    </div>`).join("");
}
function burst(){
  const box=$("particles");
  for(let i=0;i<18;i++){
    const x=50+(Math.random()-.5)*35, y=45+(Math.random()-.5)*20;
    const el=document.createElement("i");el.className="particle";
    el.style.left=x+"%";el.style.top=y+"%";el.style.animationDelay=(Math.random()*.18)+"s";
    box.appendChild(el);setTimeout(()=>el.remove(),1500);
  }
}

function build(){
 clearInterval(timer);paused=false;lock=false;first=null;matched=0;combo=0;
 const s=settings();time=s.time; $("grid").innerHTML="";
 let deck=shuffle([...icons.slice(0,s.pairs),...icons.slice(0,s.pairs)]);
 deck.forEach((icon,i)=>{const c=document.createElement("div");c.className="card";c.dataset.icon=icon;c.innerHTML=`<div class="inner"><div class="face back"></div><div class="face front">${icon}</div></div>`;c.onclick=()=>flip(c);$("grid").appendChild(c)});
 update();timer=setInterval(tick,1000);
}
function tick(){if(paused)return;time--;update();if(time<=0)end(false)}
function flip(c){
 if(lock||paused||c.classList.contains("flipped")||c.classList.contains("matched"))return;
 c.classList.add("flipped");beep(420,.05);
 if(!first){first=c;return}
 lock=true;
 if(first.dataset.icon===c.dataset.icon){
   first.classList.add("matched");c.classList.add("matched");matched++;combo++; burst();
   const gained=100+combo*25+time*2;score+=gained;beep(720,.1);toast("MATCH! +"+gained);
   first=null;lock=false;update();
   if(matched===settings().pairs)setTimeout(()=>end(true),450);
 }else{
   combo=0;setTimeout(()=>{first.classList.remove("flipped");c.classList.remove("flipped");first=null;lock=false;update();beep(180,.09)},650);
 }
}
function end(win){
 clearInterval(timer);
 saveHistory(win);paused=false;lock=true;
 if(win){score+=time*10;beep(900,.18);$("modalEmoji").textContent="🏆";$("modalTitle").textContent="Level Complete!";$("modalText").textContent=`Perfect! You cleared ${settings().pairs} pairs with ${time}s left.`;$("modalBtn").textContent="Next Level →"}
 else{$("modalEmoji").textContent="⏰";$("modalTitle").textContent="Time's Up!";$("modalText").textContent="Your memory streak is waiting. Try again!";$("modalBtn").textContent="Try Again ↻"}
 if(score>best){best=score;localStorage.setItem("memoryBest",best)}
 $("modalScore").textContent=score+" pts";$("overlay").style.display="grid";update();
}
$("modalBtn").onclick=()=>{ $("overlay").style.display="none"; if($("modalTitle").textContent.includes("Time")){score=0;level=1}else level++; build() };
$("restart").onclick=()=>{score=0;level=1;build();toast("Fresh game! Go!")}
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶ Resume":"Ⅱ Pause";toast(paused?"Game paused":"Back in action!")}
$("clearHistory").onclick=()=>{if(confirm("Clear all saved game history?")){history=[];localStorage.removeItem(HISTORY_KEY);renderHistory();renderMenu();toast("History cleared")}};
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 Sound":"🔇 Muted"}

$("menuBtn").onclick=openMenu;
$("closeMenu").onclick=closeMenu;
$("menuPanel").onclick=e=>{if(e.target===$("menuPanel"))closeMenu()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
 t.classList.add("active");$(t.dataset.tab+"Panel").classList.add("active");
});

renderHistory();
build();
</script>
</body>
</html>
